name: publish-self-hosted

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      windows_machine_host:
        description: 'Promote the QA-accepted per-machine Windows installer'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release, for example v5.6.11'
        required: true
        type: string
      windows_machine_host:
        description: 'Declare the Windows installer QA-accepted for the machine service (not legacy desktop)'
        required: false
        default: false
        type: boolean
      windows_installer_only:
        description: 'Allow installer-only feed promotion for v5.7.24/v5.7.25 after explicit authorization'
        required: false
        default: false
        type: boolean
      stage_only:
        description: 'Stage a verified draft Windows-only release on the CDN without changing any update metadata'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-self-hosted
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # GitHub requires repository push permission even to read a draft release.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      WINDOWS_MACHINE_HOST: ${{ inputs.windows_machine_host }}
      WINDOWS_INSTALLER_ONLY: ${{ inputs.windows_installer_only }}
      STAGE_ONLY: ${{ inputs.stage_only }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_UPDATE_PATH: ${{ secrets.DEPLOY_UPDATE_PATH }}
      DEPLOY_STATE_PATH: ${{ secrets.DEPLOY_STATE_PATH }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Validate restricted deployment configuration
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Stable release tag required"; exit 1; }
        if [[ "$TAG" == "v5.7.24" || "$TAG" == "v5.7.25" ]]; then
          [[ "$WINDOWS_INSTALLER_ONLY" == "true" && "$WINDOWS_MACHINE_HOST" == "true" ]] || {
            echo "::error::$TAG feed promotion requires the explicit installer-only and machine-host inputs"
            exit 1
          }
        else
          [[ "$WINDOWS_INSTALLER_ONLY" != "true" ]] || {
            echo "::error::windows_installer_only is reserved for v5.7.24/v5.7.25"
            exit 1
          }
        fi
        if [[ "$STAGE_ONLY" == "true" ]]; then
          [[ "$WINDOWS_INSTALLER_ONLY" == "true" && "$WINDOWS_MACHINE_HOST" == "true" ]] || {
            echo "::error::Draft CDN staging requires explicit installer-only and machine-host inputs"
            exit 1
          }
        fi
        for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_UPDATE_PATH DEPLOY_STATE_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
          test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
        done
        for name in DEPLOY_PATH DEPLOY_UPDATE_PATH DEPLOY_STATE_PATH; do
          [[ "${!name}" =~ ^/[a-zA-Z0-9_/-]+$ && "${!name}" != "/" ]] || { echo "::error::Unsafe $name"; exit 1; }
        done
        [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
        port="${DEPLOY_PORT:-22}"
        [[ "$port" =~ ^[0-9]+$ ]] && (( port > 0 && port < 65536 )) || exit 1
        umask 077
        mkdir -p "$RUNNER_TEMP/ssh"
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
        echo "SSH_COMMAND=ssh -p $port -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

    - name: Download and verify the existing release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir out
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out
        (cd out && sha256sum --check --strict SHA256SUMS)
        if [[ "$WINDOWS_INSTALLER_ONLY" == "true" ]]; then
          node services/prepare-release.js out validated "${TAG#v}" --windows-installer-only
        else
          node services/prepare-release.js out validated "${TAG#v}"
        fi
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
        node - <<'NODE'
        const fs = require('node:fs')
        const assert = require('node:assert/strict')
        const crypto = require('node:crypto')
        const brand = require('./src/common/brand.config')
        const release = JSON.parse(fs.readFileSync('release.json', 'utf8'))
        assert.equal(release.tag_name, process.env.TAG)
        assert.equal(release.draft, process.env.STAGE_ONLY === 'true')
        assert.equal(release.prerelease, false)
        const files = fs.readdirSync('validated')
        assert.equal(release.assets.length, files.length)
        let machineInstallers = 0
        for (const asset of release.assets) {
          assert.ok(files.includes(asset.name))
          assert.equal(asset.size, fs.statSync('validated/' + asset.name).size)
          asset.digest = 'sha256:' + crypto.createHash('sha256').update(fs.readFileSync('validated/' + asset.name)).digest('hex')
          if (process.env.WINDOWS_MACHINE_HOST === 'true' &&
              asset.name === `${brand.id}-${process.env.TAG.slice(1)}-win-x64-installer.exe`) {
            asset.windows_machine_host = 1
            machineInstallers++
          }
          asset.browser_download_url = `${brand.domains.download}/releases/${release.tag_name}/${encodeURIComponent(asset.name)}`
        }
        if (process.env.WINDOWS_MACHINE_HOST === 'true') assert.equal(machineInstallers, 1)
        fs.writeFileSync('mirrored-release.json', JSON.stringify(release))
        NODE

    - name: Upload verified assets before exposing the update
      run: |
        set -euo pipefail
        remote="$DEPLOY_USER@$DEPLOY_HOST"
        $SSH_COMMAND "$remote" "mkdir -p '$DEPLOY_PATH/releases/$TAG' '$DEPLOY_STATE_PATH'"
        rsync -a -s --partial -e "$SSH_COMMAND" validated/ "$remote:$DEPLOY_PATH/releases/$TAG/"
        $SSH_COMMAND "$remote" "cd '$DEPLOY_PATH/releases/$TAG' && sha256sum --check --strict SHA256SUMS && ln -sfn 'releases/$TAG' '$DEPLOY_PATH/$TAG'"

    - name: Expose verified update metadata
      if: ${{ inputs.stage_only != true }}
      run: |
        set -euo pipefail
        remote="$DEPLOY_USER@$DEPLOY_HOST"
        rsync -a -s -e "$SSH_COMMAND" services/publish-update.js mirrored-release.json "$remote:$DEPLOY_STATE_PATH/"
        $SSH_COMMAND "$remote" "node '$DEPLOY_STATE_PATH/publish-update.js' '$DEPLOY_STATE_PATH/mirrored-release.json' '$DEPLOY_UPDATE_PATH'"
        $SSH_COMMAND "$remote" "node '$DEPLOY_STATE_PATH/publish-update.js' '$DEPLOY_STATE_PATH/mirrored-release.json' '$DEPLOY_PATH'"
        got="$($SSH_COMMAND "$remote" "cat '$DEPLOY_UPDATE_PATH/version.html'")"
        test "$got" = "$TAG"
        echo "Published verified $TAG without deploying the main site or demo"
